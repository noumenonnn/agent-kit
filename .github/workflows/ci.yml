name: Agent Kit checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: starter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22.19.0', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # checkout v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # setup-node v6.4.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: node scripts/check-kit.mjs
      - run: node --test
      - run: node scripts/integrity.mjs
      - run: npm pack --dry-run --ignore-scripts
